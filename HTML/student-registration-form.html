<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
</head>
<center>
    <h1>Student Registration Form</h1>
</center>

<body>
    <center>
        <form action="">
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" placeholder="Enter your Name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="Email" placeholder="Enter your Email " required>
            <br><br>

            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password" placeholder="Enter your Password" required minlength="8">
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="Age" placeholder="Enter your Age" required min="18" max="45">
            <br><br>

            <label for="Dob">Date of Birth:</label>
            <input type="date" id="Dob" name="Dob" placeholder="Enter your Date of Birth" required>
            <br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            <br><br>

            <label for="language">Language:</label>
            <input type="checkbox" id="english" name="language" value="english">
            <label for="english">English</label>
            <input type="checkbox" id="hindi" name="language" value="hindi">
            <label for="hindi">Hindi</label>
            <input type="checkbox" id="html" name="language" value="spanish">
            <label for="html">HTML</label>
            <br><br>

            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select</option>
                <option value="web development">Web Development</option>
                <option value="data science">Data Science</option>
                <option value="machine learning">Machine Learning</option>
            </select>
            <br><br>

            <label for="summary">Summary:</label>
            <textarea id="summary" name="summary" placeholder="Enter a summary"></textarea>
            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </center>


</body>

</html>
