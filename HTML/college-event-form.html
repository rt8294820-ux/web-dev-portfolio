<!DOCTYPE html>
<html lang="en">

<head><center>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>
</head></center>

<body><center>
    <h1>College Event Registration</h1>
    <form action="">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <br></br>


        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br></br>


        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="100" placeholder="Enter your age">
        <br></br>


        <label for="event">Select Event Category:</label>
        <br></br>
        <input type="checkbox" id="Coding Hackathon" name="event" value="Coding Hackathon">
        <label for="Coding Hackathon">Coding Hackathon</label>
        <br></br>
        <input type="checkbox" id="Debate Competition" name="event" value="Debate Competition">
        <label for="Debate Competition">Debate Competition</label>
        <br></br>
        <input type="checkbox" id="Sports Tournament" name="event" value="Sports Tournament">
        <label for="Sports Tournament">Sports Tournament</label>
        <br></br>


        <label for="event date">Event Date:</label>
        <input type="date" id="event date" name="event date">
        <br></br>

    
        <label for="preferred time slot">Preferred Time Slot:</label>
        <input type="time" id="preferred time slot" name="preferred time slot">
        <br></br>
        
        <input type="submit" value="Register Now">
    </form>
</body></center>

</html>
